<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flight and Fight</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14161f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preload" href="assets/fonts/PixelifySans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Jersey10-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/PackFont.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/alagard.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/DungeonFont.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* One family, two files: Pixelify Sans for letters, Jersey 10 for the digits 0-9 (Pixelify draws 5 like S and 2 like 8). size-adjust makes the digits as tall as the letters. */
  @font-face { font-family: "GameFont"; src: url('assets/fonts/PixelifySans-latin.woff2') format('woff2'); font-weight: 400 700; font-display: block; unicode-range: U+0000-002F, U+003A-10FFFF; }
  @font-face { font-family: "GameFont"; src: url('assets/fonts/Jersey10-latin.woff2') format('woff2'); font-weight: 400 700; font-display: block; unicode-range: U+0030-0039; size-adjust: 125%; }
  @font-face { font-family: "Monogram"; src: url('assets/fonts/monogram-extended.ttf') format('truetype'); font-weight: 400; font-display: block; } /* thin pixel font by datagoblin (CC0): the settings screen */
  @font-face { font-family: "Alagard"; src: url('assets/fonts/alagard.ttf') format('truetype'); font-weight: 400; font-display: block; } /* Alagard by Pix3M (CC-BY): the text font */
  @font-face { font-family: "PackFont"; src: url('assets/fonts/PackFont.ttf') format('truetype'); font-weight: 400; font-display: block; } /* pixel font made from the Fantasy UI pack glyph sheet */
  @font-face { font-family: "DungeonFont"; src: url('assets/fonts/DungeonFont.ttf') format('truetype'); font-weight: 400; font-display: block; } /* ornate title font: big titles only (24 px and up) */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  /* The game is drawn small and stretched to the phone. Keep hard pixel edges, no smoothing (smoothing = blurry). */
  canvas { display: block; touch-action: none; image-rendering: auto !important; } /* the canvas is already drawn at 3x, so the browser may smooth the last small stretch */
</style>
</head>
<body>
<script>
// Android takes back graphics memory from a game in the background. Pictures the game draws itself (all text, some effects and icons)
// then came back blank. willReadFrequently keeps these drawing canvases in normal memory. Only when the game itself runs on WebGL
// (with the older canvas drawing the main picture must stay fast).
(function () {
  try {
    if (/[?&]render=canvas/.test(location.search) || !document.createElement('canvas').getContext('webgl')) return;
    var get = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, opts) {
      return type === '2d' ? get.call(this, type, Object.assign({}, opts, { willReadFrequently: true })) : get.apply(this, arguments);
    };
  } catch (e) { /* as before */ }
})();
</script>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
